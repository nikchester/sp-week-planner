  function sortText(sort) {
    return sort.map(function (s) {
      var f = fieldMap[s.field];
      return (f ? f.label : s.field) + (s.dir === 'desc' ? ' ↓' : ' ↑');
    }).join(', ');
  }

  function renderPool() {
    var list = poolTasks();
    var visibleIds = {};
    list.forEach(function (x) { visibleIds[x.id] = true; });
    Object.keys(state.poolSel).forEach(function (id) { if (!visibleIds[id]) delete state.poolSel[id]; });
    $('poolInfo').textContent = nTasks(list.length) + ' · ' + t('estimate', { t: fmtDur(hoursOf(list)) });
    $('poolSummary').textContent = viewSummary(activePoolView());
    var cur = activePreset() ? activePreset().id : 'custom';
    fill($('poolPresets'), [{ id: 'custom' }].concat(availablePresets()).map(function (p) {
      var on = cur === p.id;
      var n = poolTasks(p.id === 'custom' ? state.cfg.pool : presetView(p)).length;
      return el('button', {
        type: 'button', className: 'tog' + (on ? ' on' : ''), 'aria-pressed': on ? 'true' : 'false',
        title: t('prh_' + p.id), text: (p.id === 'custom' ? t('pr_custom') : presetLabel(p.id)) + ' · ' + n,
        onclick: run(function () {
          state.cfg.poolPreset = p.id === 'custom' ? null : p.id;
          state.poolSel = {};
          render(true);
          return saveCfg();
        })
      });
    }));
    fill($('poolList'), list.map(poolRow));
    $('poolEmpty').hidden = list.length > 0;
    renderPoolToolbar();
  }

  function overdueRow(task) {
    return taskCard(task, {
      cls: 'overdue', check: true,
      extra: [metaChip(t('week', { n: weekNum(state.assign[task.id].w) }), null, 'plain')],
      actions: [el('div', { className: 'actions' }, [el('button', {
        type: 'button', className: 'small', text: t('toCurrentBtn'),
        onclick: run(function () { return planTasks([task.id], state.curWeek); })
      })])]
    });
  }

  function weekCard(w) {
    var ld = weekLoad(w);
    var wl = limMs(weekLimitH(w));
    var over = overLimits(w);
    var lines = state.cfg.cats.map(function (c) {
      var l = limMs(catLimitH(w, c));
      var h = ld.cats[c.id].h;
      if (c.id === UNSORTED && !ld.cats[c.id].n) return null;
      return el('div', { className: 'catline' + (l && h > l ? ' over' : '') }, [
        el('span', { text: catName(c) + (c.id === UNSORTED ? ' (' + ld.cats[c.id].n + ')' : '') }),
        el('span', { text: fmtLim(h, l) + (l && h > l ? ' ⚠' : '') })
      ]);
    });
    var card = el('div', {
      className: 'wcard' + (w === state.target ? ' target' : '') + (over.length ? ' over' : ''),
      role: 'button', tabindex: '0', 'aria-pressed': w === state.target ? 'true' : 'false'
    }, [
      el('div', { className: 'wcard-head' }, [
        el('div', null, [
          el('div', { style: 'font-weight:600' }, weekTitle(w).concat(w === state.target ? [el('span', { className: 'badge', text: t('target') })] : [])),
          el('div', { className: 'muted', text: weekRange(w) })
        ]),
        el('button', {
          type: 'button', className: 'small', text: t('openWeek'),
          onclick: stop(function () { state.week = w; setPage('week'); })
        })
      ]),
      el('div', { className: 'catline' + (wl && ld.total > wl ? ' over' : ''), style: 'margin-top:6px;font-size:13px' }, [
        el('b', { text: nTasks(ld.tasks.length) }),
        el('b', { text: fmtLim(ld.total, wl) })
      ]),
      loadBar(ld.total, wl)
    ].concat(lines));
    var select = function () { state.target = w; render(true); };
    card.addEventListener('click', select);
    card.addEventListener('keydown', function (ev) {
      if (ev.target === card && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); select(); }
    });
    makeDropTarget(card, function (id) { return planTasks([id], w); });
    return card;
  }

  function renderPlan() {
    renderPool();
    var overdue = overdueTasks();
    $('overdueSec').hidden = overdue.length === 0;
    fill($('overdueList'), overdue.map(overdueRow));
    var weeks = [];
    for (var i = 0; i < PLAN_WEEKS; i++) weeks.push(shiftWeek(state.planStart, i));
    $('planTitle').textContent = t('planTitle', { a: weekNum(weeks[0]), b: weekNum(weeks[weeks.length - 1]) });
    fill($('weeksGrid'), weeks.map(weekCard));
  }

  // ---------- week page ----------
  function weekCardTask(task) {
    // Week moves, unplanning and the estimate live in the task menu; the card stays compact.
    var hasSubs = (task.subTaskIds || []).length > 0;
    var onEst = hasSubs || state.archived[task.id] ? null : function (ev) {
      var r = ev.currentTarget.getBoundingClientRect();
      openCtx(task.id, r.left, r.bottom + 2, 'est');
    };
    return taskCard(task, { check: true, onEst: onEst });
  }

  function renderWeekPage() {
    var w = state.week;
    fill($('weekTitle'), weekTitle(w));
    $('weekRange').textContent = weekRange(w, true);
    $('weekToday').hidden = w === state.curWeek;

    var over = overLimits(w);
    $('weekBanner').hidden = !over.length;
    $('weekBanner').textContent = over.length ? '⚠ ' + t('overBanner') + ': ' + over.map(function (o) {
      return t('overItem', { name: o.name, a: fmtDur(o.h), b: fmtDur(o.lim), x: fmtDur(o.h - o.lim) });
    }).join('; ') : '';

    var ld = weekLoad(w);
    var wl = limMs(weekLimitH(w));
    var done = ld.tasks.filter(function (x) { return x.isDone; }).length;
    var days = weekDays(w), spent = 0;
    ld.tasks.forEach(function (task) {
      var map = task.timeSpentOnDay || {};
      days.forEach(function (d) { spent += map[d] || 0; });
    });
    fill($('weekPanel'), [
      el('span', { className: 'hours' + (wl && ld.total > wl ? ' over' : '') }, [t('weekTotal', { t: fmtDur(ld.total) }), limitInput('_week'), t('h')]),
      el('span', { className: 'muted', text: t('doneN', { d: done, n: ld.tasks.length }) }),
      el('span', { className: 'muted', text: t('spentWeek', { t: fmtDur(spent) }) }),
      allocEl(),
      limitsModeEl(w),
      loadBar(ld.total, wl)
    ]);
    $('addInput').placeholder = t('addPh', { c: catName(catById(UNSORTED)) });

    fill($('weekBoard'), state.cfg.cats.map(function (c) {
      var all = ld.tasks.filter(function (x) { return catIdOf(x) === c.id; });
      var view = colItems('w:' + c.id, all);
      var items = view.shown;
      var h = ld.cats[c.id].h, l = limMs(catLimitH(w, c)), isOver = !!l && h > l;
      var col = el('div', { className: 'bcol' + (isOver ? ' over' : '') }, [
        colHead('w:' + c.id, catName(c), all, view,
          el('span', { className: 'hours' + (isOver ? ' over' : '') }, [fmtDur(h) + ' /', limitInput(c.id), t('h')])),
        l ? loadBar(h, l) : null,
        isOver ? el('div', { className: 'muted bad-text', style: 'margin-bottom:6px', text: '⚠ ' + t('over', { t: fmtDur(h - l) }) }) : null,
        items.length ? el('ul', { className: 'list' }, items.map(weekCardTask)) : el('p', { className: 'muted empty', text: t('emptyCol') })
      ]);
      makeDropTarget(col, function (id) {
        var e = state.assign[id];
        if (!e) return planTasks([id], w).then(function () { return moveToCat(id, c.id); });
        if (e.w !== w) return Promise.resolve();
        return moveToCat(id, c.id);
      });
      return col;
    }));

    var chips = [];
    for (var i = -1; i <= 6; i++) {
      (function (key) {
        var kl = weekLoad(key);
        var ov = overLimits(key);
        var chip = el('button', {
          type: 'button', className: 'chip' + (key === w ? ' sel' : '') + (ov.length ? ' over' : ''),
          title: ov.length ? t('overBanner') + ': ' + ov.map(function (o) { return o.name; }).join(', ') : null,
          onclick: function () { state.week = key; render(true); }
        }, [
          el('span', { className: 'muted', text: t('week', { n: weekNum(key) }) + (ov.length ? ' ⚠' : '') }),
          el('b', { text: fmtLim(kl.total, limMs(weekLimitH(key))) }),
          el('span', { className: 'muted', text: nTasks(kl.tasks.length) }),
          el('span', { className: 'muted', text: fmtDay(weekMonday(key)) })
        ]);
        makeDropTarget(chip, function (id) { return planTasks([id], key); });
        chips.push(chip);
      })(shiftWeek(state.curWeek, i));
    }
    fill($('weekStrip'), chips);
  }

  // ---------- kanban page ----------
  // Status changes: drag between columns, the checkbox, or the task menu.
  function kanbanCard(task) {
    var c = catById(catIdOf(task));
    return taskCard(task, { check: true, extra: [metaChip(catName(c), { color: 'var(--accent)' }, 'tag')] });
  }

  function renderKanban() {
    var w = state.kWeek;
    $('kTitle').textContent = t('kTitle', { n: weekNum(w) });
    $('kRange').textContent = weekRange(w, true) + ' · ' + t(weekKind(w));
    $('kToday').hidden = w === state.curWeek;
    var ld = weekLoad(w);
    if (state.kCat && !state.cfg.cats.some(function (c) { return c.id === state.kCat; })) state.kCat = null;

    var chipBtns = [{ id: null, name: t('kAll'), n: ld.tasks.length }].concat(state.cfg.cats.map(function (c) {
      return { id: c.id, name: catName(c), n: ld.cats[c.id].n };
    })).map(function (o) {
      var on = state.kCat === o.id;
      return el('button', {
        type: 'button', className: 'tog' + (on ? ' on' : ''), 'aria-pressed': on ? 'true' : 'false',
        text: o.name + ' · ' + o.n, onclick: function () { state.kCat = o.id; render(true); }
      });
    });
    fill($('kCats'), chipBtns);

    var items = ld.tasks.filter(function (x) { return !state.kCat || catIdOf(x) === state.kCat; });
    var total = hoursOf(items);
    var doneH = hoursOf(items.filter(function (x) { return x.isDone; }));
    fill($('kPanel'), [
      el('span', { text: t('kDone', { d: fmtDur(doneH), t: fmtDur(total) }) }),
      el('div', { className: 'bar' }, [el('div', { style: 'width:' + (total ? Math.round(doneH / total * 100) : 0) + '%' })])
    ]);

    fill($('kBoard'), STATUSES.map(function (s) {
      var all = items.filter(function (x) { return statusOf(x) === s; });
      var view = colItems('k:' + s, all);
      var list = view.shown;
      var col = el('div', { className: 'bcol st-' + s }, [
        colHead('k:' + s, t('st_' + s), all, view, el('span', { className: 'muted', text: fmtDur(hoursOf(all)) })),
        list.length ? el('ul', { className: 'list' }, list.map(kanbanCard)) : el('p', { className: 'muted empty', text: t('emptyCol') })
      ]);
      makeDropTarget(col, function (id) {
        var task = state.tasks[id];
        if (!task || !state.assign[id] || state.assign[id].w !== w) return Promise.resolve();
        return setStatus(task, s);
      });
      return col;
    }));
  }

  // ---------- task context menu ----------
  // The native task menu of Super Productivity cannot be opened from a plugin (no API for it),
  // so the plugin shows its own menu with the actions the plugin API allows.
  var ctx = null; // { id, view, x, y, delArmed }

  function prioOf(task) {
    var p = Number(task.priority);
    return p >= 1 && p <= 3 ? p : null;
  }

  function prioBadge(p) {
    return el('span', { className: 'prio prio-' + p, text: String(p), title: t('ctxPriority') + ' ' + p });
  }

  function attachCtx(li, task, holder) {
    li.addEventListener('contextmenu', function (ev) {
      ev.preventDefault();
      ev.stopPropagation();
      openCtx(task.id, ev.clientX, ev.clientY);
    });
    if (holder) {
      holder.appendChild(el('button', {
        type: 'button', className: 'more-btn', text: '⋯', title: t('ctxMore'), 'aria-haspopup': 'menu',
        onclick: stop(function (ev) {
          var r = ev.currentTarget.getBoundingClientRect();
          openCtx(task.id, r.left, r.bottom + 2);
        })
      }));
    }
  }

  function openCtx(id, x, y, view) {
    ctx = { id: id, view: view || 'main', x: x, y: y, delArmed: false };
    renderCtx();
  }

  function closeCtx() {
    ctx = null;
    $('ctxMenu').hidden = true;
    fill($('ctxMenu'), []);
  }

  function ctxGo(view) {
    ctx.view = view;
    ctx.delArmed = false;
    renderCtx();
  }

  // Runs an action, closes the menu and refreshes data afterwards.
  function ctxAct(fn) {
    return function () {
      closeCtx();
      run(function () { return Promise.resolve(fn()).then(scheduleLoad); })();
    };
  }

  function ctxItem(ico, label, onClick, opts) {
    opts = opts || {};
    return el('button', {
      type: 'button', role: 'menuitem', className: 'ctx-item' + (opts.cls ? ' ' + opts.cls : ''),
      disabled: opts.disabled ? 'disabled' : null, title: opts.title || null, onclick: onClick
    }, [
      el('span', { className: 'ico', text: ico }),
      opts.lead || null,
      el('span', { className: 'grow', text: label }),
      opts.val ? el('span', { className: 'val', text: opts.val }) : null,
      opts.valNode || null,
      opts.sub ? el('span', { className: 'val', text: '▸' }) : null
    ]);
  }
  function ctxSep() { return el('div', { className: 'ctx-sep', role: 'separator' }); }
  function ctxBack(title) {
    return [ctxItem('', t('ctxBack'), function () { ctxGo('main'); }), el('div', { className: 'ctx-head', text: title }), ctxSep()];
  }
  function radio(on) { return on ? '●' : '○'; }

  async function updateTaskFields(task, changes) {
    Object.keys(changes).forEach(function (k) { task[k] = changes[k]; });
    render(true);
    await PluginAPI.updateTask(task.id, changes);
  }

  function setDue(task, day) {
    return updateTaskFields(task, { dueDay: day, dueWithTime: null });
  }

  function nextMonday() {
    var d = parseYmd(state.today);
    d.setDate(d.getDate() + 7 - (d.getDay() + 6) % 7); // Monday of next week
    return ymd(d);
  }

  async function deleteTaskFully(task) {
    await PluginAPI.deleteTask(task.id);
    if (state.assign[task.id]) {
      delete state.assign[task.id];
      await PluginAPI.persistDataSynced('', KEY_PREFIX + task.id);
    }
    delete state.tasks[task.id];
    render(true);
    showToast(t('ctxDeleted'), false, null);
  }

  function ctxMain(task) {
    var archived = !!state.archived[task.id];
    var hasSubs = (task.subTaskIds || []).length > 0;
    var e = state.assign[task.id];
    var dateBtn = function (ico, label, day) {
      return el('button', {
        type: 'button', role: 'menuitem', className: 'ctx-date', title: t('ctxDueTitle', { d: fmtDay(parseYmd(day)) }),
        onclick: ctxAct(function () { return setDue(task, day); })
      }, [el('span', { className: 'ico', text: ico }), el('span', { text: label })]);
    };
    var items = [];
    if (!archived) {
      items.push(el('div', { className: 'ctx-dates' }, [
        dateBtn('☀', t('ctxToday'), state.today),
        dateBtn('☽', t('ctxTomorrow'), addDays(state.today, 1)),
        dateBtn('»', t('ctxNextMon'), nextMonday()),
        el('button', { type: 'button', role: 'menuitem', className: 'ctx-date', onclick: function () { ctxGo('date'); } },
          [el('span', { className: 'ico', text: '▦' }), el('span', { text: t('ctxDate') })])
      ]));
      items.push(ctxSep());
    }
    items.push(ctxItem('✓', task.isDone ? t('ctxUndone') : t('ctxDone'),
      ctxAct(function () { return toggleDone(task, !task.isDone); }), { disabled: archived }));
    if (typeof PluginAPI.startTracking === 'function' && !task.isDone && !archived) {
      items.push(ctxItem('▷', t('ctxTrack'), ctxAct(function () { return PluginAPI.startTracking(task.id); })));
    }
    items.push(ctxSep());
    items.push(ctxItem('⧗', t('ctxEstimate'), function () { ctxGo('est'); }, {
      sub: true, val: task.timeEstimate ? fmtDur(task.timeEstimate) : '',
      disabled: hasSubs || archived, title: hasSubs ? t('estFromSubs') : null
    }));
    items.push(ctxItem('#', t('ctxTags'), function () { ctxGo('tags'); }, { sub: true, disabled: archived }));
    items.push(ctxItem('⇄', t('ctxProject'), function () { ctxGo('project'); }, {
      sub: true, disabled: archived, val: state.projects[task.projectId] || ''
    }));
    items.push(ctxItem('!', t('ctxPriority'), function () { ctxGo('prio'); }, {
      sub: true, disabled: archived, valNode: prioOf(task) ? prioBadge(prioOf(task)) : null
    }));
    items.push(ctxSep());
    items.push(ctxItem('◫', t('ctxWeek'), function () { ctxGo('week'); }, {
      sub: true, val: e ? t('week', { n: weekNum(e.w) }) : t('ctxNotPlanned')
    }));
    if (e) {
      items.push(ctxItem('◔', t('ctxStatus'), function () { ctxGo('status'); }, {
        sub: true, disabled: archived, val: t('st_' + statusOf(task))
      }));
    }
    if (e) items.push(ctxItem('▤', t('ctxCat'), function () { ctxGo('cat'); }, { sub: true, val: catName(catById(e.c)) }));
    if (!archived) {
      items.push(ctxItem('↗', t('ctxOpen'), ctxAct(function () { return PluginAPI.selectTask(task.id); })));
    }
    items.push(ctxSep());
    items.push(ctxItem('🗑', ctx.delArmed ? t('ctxDelConfirm') : t('ctxDelete'), function () {
      if (!ctx.delArmed) { ctx.delArmed = true; renderCtx(); return; }
      ctxAct(function () { return deleteTaskFully(task); })();
    }, { cls: 'danger' + (ctx.delArmed ? ' armed' : '') }));
    return items;
  }

  function ctxSub(task, view) {
    var items;
    if (view === 'date') {
      items = ctxBack(t('ctxDate'));
      var input = el('input', { type: 'date', value: task.dueDay || (task.dueWithTime ? dayOf(task.dueWithTime) : state.today) });
      items.push(el('div', { className: 'ctx-form' }, [
        input,
        el('button', { type: 'button', className: 'small primary', text: t('ctxSetDue'),
          onclick: function () { if (input.value) ctxAct(function () { return setDue(task, input.value); })(); } })
      ]));
      if (task.dueDay || task.dueWithTime) {
        items.push(ctxItem('✕', t('ctxClearDue'), ctxAct(function () { return updateTaskFields(task, { dueDay: null, dueWithTime: null }); })));
      }
      return items;
    }
    if (view === 'est') {
      items = ctxBack(t('ctxEstimate'));
      [0.25, 0.5, 1, 2, 3, 4, 8].forEach(function (h) {
        items.push(ctxItem(radio(task.timeEstimate === h * HOUR), fmtDur(h * HOUR), ctxAct(function () { return setEstimate(task, h); })));
      });
      var custom = el('input', { type: 'number', min: '0', step: '0.25', style: 'width:90px', placeholder: t('h') });
      var apply = function () {
        var v = parseFloat(String(custom.value).replace(',', '.'));
        if (v >= 0) ctxAct(function () { return setEstimate(task, v); })();
      };
      custom.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); apply(); } });
      items.push(el('div', { className: 'ctx-form' }, [
        el('span', { className: 'muted', text: t('ctxCustom') }), custom,
        el('button', { type: 'button', className: 'small', text: t('ctxApply'), onclick: apply })
      ]));
      items.push(ctxItem('✕', t('ctxNoEst'), ctxAct(function () { return setEstimate(task, 0); })));
      return items;
    }
    if (view === 'tags') {
      items = ctxBack(t('ctxTags'));
      var ids = Object.keys(state.tags);
      if (!ids.length) items.push(el('div', { className: 'ctx-form muted', text: t('noOptions') }));
      ids.forEach(function (id) {
        var on = (task.tagIds || []).indexOf(id) !== -1;
        items.push(ctxItem(on ? '☑' : '☐', '#' + state.tags[id], function () {
          var next = (task.tagIds || []).filter(function (x) { return x !== id; });
          if (!on) next.push(id);
          run(function () { return updateTaskFields(task, { tagIds: next }).then(function () { renderCtx(); }); })();
        }, { cls: on ? 'on' : '' }));
      });
      return items;
    }
    if (view === 'project') {
      items = ctxBack(t('ctxProject'));
      Object.keys(state.projects).forEach(function (id) {
        items.push(ctxItem(radio(task.projectId === id), state.projects[id],
          ctxAct(function () { return task.projectId === id ? null : updateTaskFields(task, { projectId: id }); })));
      });
      return items;
    }
    if (view === 'prio') {
      items = ctxBack(t('ctxPriority'));
      [1, 2, 3].forEach(function (p) {
        items.push(ctxItem(radio(prioOf(task) === p), t('ctxPriority') + ' ' + p,
          ctxAct(function () { return updateTaskFields(task, { priority: p }); }), { lead: prioBadge(p) }));
      });
      items.push(ctxItem(radio(!prioOf(task)), t('ctxNoPrio'), ctxAct(function () { return updateTaskFields(task, { priority: null }); })));
      return items;
    }
    if (view === 'week') {
      items = ctxBack(t('ctxWeek'));
      var cur = state.assign[task.id] ? state.assign[task.id].w : null;
      if (cur) {
        [['ctxEarlier', -1], ['ctxLater', 1]].forEach(function (p) {
          var to = shiftWeek(cur, p[1]);
          items.push(ctxItem(p[1] < 0 ? '←' : '→', t(p[0]), ctxAct(function () { return planTasks([task.id], to); }),
            { val: t('week', { n: weekNum(to) }) }));
        });
        items.push(ctxSep());
      }
      [['ctxThisWeek', 0], ['ctxNextWeek', 1], ['ctxWeekAfter', 2]].forEach(function (p) {
        var w = shiftWeek(state.curWeek, p[1]);
        items.push(ctxItem(radio(cur === w), t(p[0]), ctxAct(function () { return planTasks([task.id], w); }),
          { val: t('week', { n: weekNum(w) }) }));
      });
      if (cur) items.push(ctxItem('✕', t('ctxUnplan'), ctxAct(function () { return planTasks([task.id], null); })));
      return items;
    }
    if (view === 'status') {
      items = ctxBack(t('ctxStatus'));
      STATUSES.forEach(function (st) {
        items.push(ctxItem(radio(statusOf(task) === st), t('st_' + st), ctxAct(function () { return setStatus(task, st); })));
      });
      return items;
    }
    if (view === 'cat') {
      items = ctxBack(t('ctxCat'));
      var cid = catIdOf(task);
      state.cfg.cats.forEach(function (c) {
        items.push(ctxItem(radio(cid === c.id), catName(c), ctxAct(function () { return moveToCat(task.id, c.id); })));
      });
      return items;
    }
    return [];
  }

  function renderCtx() {
    if (!ctx) return;
    var task = state.tasks[ctx.id];
    if (!task) { closeCtx(); return; }
    var m = $('ctxMenu');
    fill(m, ctx.view === 'main' ? ctxMain(task) : ctxSub(task, ctx.view));
    m.hidden = false;
    // Keep the menu inside the window.
    var w = m.offsetWidth, h = m.offsetHeight;
    var x = Math.max(8, Math.min(ctx.x, window.innerWidth - w - 8));
    var y = Math.max(8, Math.min(ctx.y, window.innerHeight - h - 8));
    m.style.left = x + 'px';
    m.style.top = y + 'px';
    var first = m.querySelector('button:not(:disabled), input');
    if (first) first.focus();
  }

  function ctxKeydown(ev) {
    if (!ctx) return false;
    if (ev.key === 'Escape') {
      if (ctx.view !== 'main') ctxGo('main');
      else closeCtx();
      return true;
    }
    if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
      var btns = Array.prototype.slice.call($('ctxMenu').querySelectorAll('button:not(:disabled)'));
      var i = btns.indexOf(document.activeElement);
      var next = ev.key === 'ArrowDown' ? (i + 1) % btns.length : (i - 1 + btns.length) % btns.length;
      if (btns[next]) btns[next].focus();
      ev.preventDefault();
      return true;
    }
    return false;
  }

  // ---------- page switching ----------
  function setPage(p) {
    state.page = p;
    render(true);
    try { window.scrollTo(0, 0); } catch (e) { /* not available in every environment */ }
  }

  function render(force) {
    if (!state.curWeek) return;
    var ae = document.activeElement;
    if (!force && ae && ae.classList && ae.classList.contains('live-input')) { pendingRender = true; return; }
    pendingRender = false;
    $('tabPlan').textContent = t('tabPlan');
    $('tabWeek').textContent = t('tabWeek', { n: weekNum(state.week) });
    $('tabKanban').textContent = t('tabKanban');
    ['plan', 'week', 'kanban'].forEach(function (p) {
      var tab = $('tab' + p.charAt(0).toUpperCase() + p.slice(1));
      tab.classList.toggle('on', state.page === p);
      tab.setAttribute('aria-selected', state.page === p ? 'true' : 'false');
    });
    $('pagePlan').hidden = state.page !== 'plan';
    $('pageWeek').hidden = state.page !== 'week';
    $('pageKanban').hidden = state.page !== 'kanban';
    if (state.page === 'plan') renderPlan();
    if (state.page === 'week') renderWeekPage();
    if (state.page === 'kanban') renderKanban();
  }

  // ---------- editors ----------
  // col: { key, name, tasks } of the board column, for kind 'col'.
  function openEditor(kind, col) {
    var draft;
    if (kind === 'pool') draft = JSON.parse(JSON.stringify(activePoolView()));
    else if (kind === 'col') {
      var v = colView(col.key);
      draft = JSON.parse(JSON.stringify({ match: v.match, conds: v.conds, sort: v.sort }));
    } else draft = JSON.parse(JSON.stringify({ cats: state.cfg.cats, weekLimitH: state.cfg.weekLimitH, cardSort: state.cfg.cardSort }));
    editor = { kind: kind, col: col || null, draft: draft, orig: JSON.stringify(draft), armed: null, discardArmed: false };
    $('overlay').hidden = false;
    renderEditor();
  }
  function closeEditor() {
    editor = null;
    $('overlay').hidden = true;
    fill($('modal'), []);
  }
  function requestCloseEditor() {
    if (!editor) return;
    if (JSON.stringify(editor.draft) !== editor.orig && !editor.discardArmed) {
      editor.discardArmed = true;
      renderEditor();
      return;
    }
    closeEditor();
  }

  function defaultValue(type, op) {
    if (NO_VALUE_OPS[op]) return undefined;
    if (type === 'ref' || type === 'set') return [];
    if (op === 'withinDays' || op === 'byDays') return 7;
    if (op === 'olderThanDays') return 30;
    if (type === 'date') return state.today;
    if (type === 'num' || type === 'dur') return 0;
    return '';
  }

  function fieldSelect(current, onChange) {
    var s = el('select');
    if (!fieldMap[current]) s.appendChild(el('option', { value: current, text: current }));
    GROUPS.forEach(function (g) {
      var inGroup = fields.filter(function (f) { return f.group === g; });
      if (!inGroup.length) return;
      var og = el('optgroup', { label: t('g_' + g) });
      inGroup.forEach(function (f) { og.appendChild(el('option', { value: f.id, text: f.label })); });
      s.appendChild(og);
    });
    s.value = current;
    s.addEventListener('change', function () { onChange(s.value); });
    return s;
  }

  function chipSelect(options, selected, onChange) {
    var chosen = selected.slice();
    if (!options.length) return el('span', { className: 'muted', text: t('noOptions') });
    var wrap = el('div', { className: 'chipsel' });
    options.forEach(function (o) {
      var on = chosen.indexOf(o.id) !== -1;
      var b = el('button', { type: 'button', className: 'tog' + (on ? ' on' : ''), text: o.title, 'aria-pressed': on ? 'true' : 'false' });
      b.addEventListener('click', function () {
        var i = chosen.indexOf(o.id);
        if (i === -1) chosen.push(o.id);
        else chosen.splice(i, 1);
        b.classList.toggle('on', i === -1);
        b.setAttribute('aria-pressed', i === -1 ? 'true' : 'false');
        onChange(chosen.slice());
      });
      wrap.appendChild(b);
    });
    return wrap;
  }

  function valueText(f, c) {
    if (f.type === 'ref') return (c.value || []).map(function (id) { return state.projects[id] || id; }).join(', ');
    if (f.type === 'set') return (c.value || []).map(function (id) { return '#' + tagTitle(id); }).join(', ');
    if (f.type === 'dur') return (c.value || 0) + ' ' + t('h');
    if (DAYS_OPS[c.op]) return (c.value || 0) + ' ' + (c.op === 'olderThanDays' ? t('daysAgo') : t('days'));
    return c.value === undefined ? '' : String(c.value);
  }
  function condText(c) {
    var f = fieldMap[c.field];
    var label = f ? f.label : c.field;
    if (f && f.type === 'bool') return label + ': ' + t('op_' + c.op);
    var s = label + ' ' + t('op_' + c.op);
    if (!NO_VALUE_OPS[c.op] && f) s += ' ' + valueText(f, c);
    return s;
  }

  function valueEditor(f, c) {
    if (NO_VALUE_OPS[c.op]) return null;
    var upd = function (v) { c.value = v; updatePreview(); };
    if (f.type === 'ref') {
      return chipSelect(Object.keys(state.projects).map(function (id) { return { id: id, title: state.projects[id] }; }), c.value || [], upd);
    }
    if (f.type === 'set') {
      return chipSelect(Object.keys(state.tags).map(function (id) { return { id: id, title: '#' + state.tags[id] }; }), c.value || [], upd);
    }
    if (f.type === 'date' && !DAYS_OPS[c.op]) {
      return el('input', { type: 'date', value: c.value || '', oninput: function (ev) { upd(ev.target.value); } });
    }
    if (f.type === 'num' || f.type === 'dur' || DAYS_OPS[c.op]) {
      var unit = f.type === 'dur' ? t('h') : (c.op === 'olderThanDays' ? t('daysAgo') : (DAYS_OPS[c.op] ? t('days') : ''));
      var inp = el('input', {
        type: 'number', step: f.type === 'dur' ? '0.25' : '1', style: 'width:90px', value: c.value === undefined ? '' : String(c.value),
        oninput: function (ev) { upd(parseFloat(String(ev.target.value).replace(',', '.')) || 0); }
      });
      return unit ? el('span', null, [inp, ' ' + unit]) : inp;
    }
    return el('input', { type: 'text', style: 'width:200px', value: c.value || '', oninput: function (ev) { upd(ev.target.value); } });
  }

  function condRow(c, i, conds) {
    var f = fieldMap[c.field];
    var type = f ? f.type : 'text';
    var opSel = el('select');
    (OPS[type] || []).forEach(function (op) { opSel.appendChild(el('option', { value: op, text: t('op_' + op) })); });
    opSel.value = c.op;
    opSel.addEventListener('change', function () {
      var shape = function (op) { return NO_VALUE_OPS[op] ? 'none' : (DAYS_OPS[op] ? 'days' : 'v'); };
      var old = shape(c.op);
      c.op = opSel.value;
      if (old !== shape(c.op)) c.value = defaultValue(type, c.op);
      renderEditor();
    });
    return el('div', { className: 'cond' }, [
      fieldSelect(c.field, function (id) {
        c.field = id;
        c.op = OPS[fieldMap[id].type][0];
        c.value = defaultValue(fieldMap[id].type, c.op);
        renderEditor();
      }),
      opSel,
      el('button', { type: 'button', className: 'icon', text: '✕', 'aria-label': t('del'), onclick: function () { conds.splice(i, 1); renderEditor(); } }),
      f ? valueEditor(f, c) : null
    ]);
  }

  function moveIn(arr, i, delta) {
    var j = i + delta;
    if (j < 0 || j >= arr.length) return;
    var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    renderEditor();
  }

  function sortRows(sort) {
    var rows = sort.length ? sort.map(function (s, i) {
      var dirSel = el('select');
      dirSel.appendChild(el('option', { value: 'asc', text: t('asc') }));
      dirSel.appendChild(el('option', { value: 'desc', text: t('desc') }));
      dirSel.value = s.dir === 'desc' ? 'desc' : 'asc';
      dirSel.addEventListener('change', function () { s.dir = dirSel.value; });
      return el('div', { className: 'sortrow' }, [
        el('span', { className: 'muted', text: (i + 1) + '.' }),
        fieldSelect(s.field, function (id) { s.field = id; }),
        dirSel,
        el('button', { type: 'button', className: 'icon', text: '↑', 'aria-label': '↑', onclick: function () { moveIn(sort, i, -1); } }),
        el('button', { type: 'button', className: 'icon', text: '↓', 'aria-label': '↓', onclick: function () { moveIn(sort, i, 1); } }),
        el('button', { type: 'button', className: 'icon', text: '✕', 'aria-label': t('del'), onclick: function () { sort.splice(i, 1); renderEditor(); } })
      ]);
    }) : [el('p', { className: 'muted', text: t('noSort') })];
    return rows.concat([el('button', {
      type: 'button', className: 'small', text: t('addSort'),
      onclick: function () { sort.push({ field: 'due', dir: 'asc' }); renderEditor(); }
    })]);
  }

  function updatePreview() {
    var p = $('edPreview');
    if (!p || !editor) return;
    if (editor.kind === 'pool') p.textContent = t('previewPool', { n: poolTasks(editor.draft).length });
    else if (editor.kind === 'col') {
      var all = editor.col.tasks;
      p.textContent = t('previewCol', { a: all.filter(function (x) { return matchView(x, editor.draft); }).length, n: all.length });
    } else p.textContent = '';
  }

  function catRows(d) {
    return d.cats.map(function (c, i) {
      var isUnsorted = c.id === UNSORTED;
      var armed = editor.armed === c.id;
      return el('div', { className: 'catrow' }, [
        el('input', {
          type: 'text', value: c.name, placeholder: catName({ id: c.id, name: '' }), 'aria-label': t('catName'),
          oninput: function (ev) { c.name = ev.target.value; }
        }),
        el('input', {
          type: 'number', min: '0', step: '0.5', style: 'width:90px', value: c.limitH ? String(c.limitH) : '',
          placeholder: '∞', 'aria-label': t('catLimit'),
          oninput: function (ev) { var v = parseFloat(String(ev.target.value).replace(',', '.')); c.limitH = v > 0 ? v : null; updateAlloc(); }
        }),
        el('span', { className: 'muted', text: t('catLimit') }),
        el('button', { type: 'button', className: 'icon', text: '↑', 'aria-label': '↑', onclick: function () { moveIn(d.cats, i, -1); } }),
        el('button', { type: 'button', className: 'icon', text: '↓', 'aria-label': '↓', onclick: function () { moveIn(d.cats, i, 1); } }),
        isUnsorted ? null : el('button', {
          type: 'button', className: 'small danger' + (armed ? ' armed' : ''), text: armed ? t('delConfirm') : t('del'),
          onclick: function () {
            if (!armed) { editor.armed = c.id; renderEditor(); return; }
            d.cats.splice(i, 1);
            editor.armed = null;
            renderEditor();
          }
        })
      ]);
    });
  }

  function renderEditor() {
    if (!editor) return;
    var d = editor.draft;
    var nodes = [];
    if (editor.kind === 'pool' || editor.kind === 'col') {
      if (editor.kind === 'pool') {
        nodes.push(el('h2', { text: t('edPool') }));
        if (activePreset()) nodes.push(el('p', { className: 'muted', text: t('edPoolFrom', { p: presetLabel(activePreset().id) }) }));
      } else {
        nodes.push(el('h2', { text: t('edCol', { name: editor.col.name }) }));
        nodes.push(el('p', { className: 'muted', text: t('edColHint') }));
      }
      var matchSel = el('select');
      matchSel.appendChild(el('option', { value: 'all', text: t('matchAll') }));
      matchSel.appendChild(el('option', { value: 'any', text: t('matchAny') }));
      matchSel.value = d.match === 'any' ? 'any' : 'all';
      matchSel.addEventListener('change', function () { d.match = matchSel.value; updatePreview(); });
      nodes.push(el('div', { className: 'field' }, [
        el('label', { text: t('conds') }),
        el('div', { className: 'sortrow' }, [el('span', { className: 'muted', text: t('match') }), matchSel])
      ].concat(d.conds.length ? d.conds.map(function (c, i) { return condRow(c, i, d.conds); }) : [el('p', { className: 'muted', text: t('noConds') })])
        .concat([el('button', {
          type: 'button', className: 'small', text: t('addCond'),
          onclick: function () { d.conds.push({ field: 'tags', op: 'any', value: [] }); renderEditor(); }
        })])));
      nodes.push(el('div', { className: 'field' }, [el('label', { text: t('sort') })].concat(sortRows(d.sort))));
      nodes.push(el('div', { id: 'edPreview', className: 'muted' }));
    } else {
      nodes.push(el('h2', { text: t('edCats') }));
      nodes.push(el('p', { className: 'muted', text: t('edCatsHint') }));
      nodes.push(el('div', { className: 'field' }, catRows(d).concat([el('button', {
        type: 'button', className: 'small', text: t('addCat'),
        onclick: function () { d.cats.push({ id: 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), name: '', limitH: null }); renderEditor(); }
      })])));
      nodes.push(el('div', { className: 'field' }, [
        el('label', { text: t('weekLimit') }),
        el('input', {
          type: 'number', min: '0', step: '0.5', style: 'width:120px', value: d.weekLimitH ? String(d.weekLimitH) : '', placeholder: '∞',
          oninput: function (ev) { var v = parseFloat(String(ev.target.value).replace(',', '.')); d.weekLimitH = v > 0 ? v : null; updateAlloc(); }
        }),
        el('div', { id: 'edAlloc', className: 'muted', style: 'margin-top:6px' })
      ]));
      nodes.push(el('div', { className: 'field' }, [el('label', { text: t('cardSort') })].concat(sortRows(d.cardSort))));
    }
    if (editor.discardArmed) nodes.push(el('div', { className: 'notice', role: 'alert', text: t('unsaved') }));
    nodes.push(el('div', { className: 'modal-foot' }, [
      editor.kind === 'col' ? el('button', {
        type: 'button', text: t('colReset'),
        onclick: function () { editor.draft = { match: 'all', conds: [], sort: JSON.parse(JSON.stringify(state.cfg.cardSort)) }; renderEditor(); }
      }) : null,
      el('span', { className: 'grow' }),
      el('button', { type: 'button', text: editor.discardArmed ? t('discard') : t('cancel'), onclick: requestCloseEditor }),
      el('button', { type: 'button', id: 'edSave', className: 'primary', text: t('save'), onclick: run(saveEditor) })
    ]));
    fill($('modal'), nodes);
    updatePreview();
    updateAlloc();
  }

  function allocOver(d) {
    return !!d.weekLimitH && catLimitSum(d.cats) > d.weekLimitH;
  }

  function updateAlloc() {
    if (!editor || editor.kind !== 'cats') return;
    var d = editor.draft;
    var box = $('edAlloc');
    var sum = catLimitSum(d.cats);
    var over = allocOver(d);
    if (box) {
      box.className = over ? 'bad-text' : 'muted';
      box.textContent = !d.weekLimitH ? t('edAllocNoWeek', { a: hrs(sum) })
        : (over ? '⚠ ' + t('edAllocOver', { a: hrs(sum), b: hrs(d.weekLimitH) }) : t('edAllocOk', { a: hrs(sum), b: hrs(d.weekLimitH) }));
    }
    if ($('edSave')) $('edSave').disabled = over;
  }

  async function saveEditor() {
    if (!editor) return;
    var d = editor.draft;
    if (editor.kind === 'cats' && allocOver(d)) { updateAlloc(); return; }
    if (editor.kind === 'pool') {
      state.cfg.pool = { id: 'pool', match: d.match === 'any' ? 'any' : 'all', conds: d.conds, sort: d.sort };
      state.cfg.poolPreset = null; // the edited filter becomes "My filter"
    } else if (editor.kind === 'col') {
      var views = state.cfg.colViews = state.cfg.colViews || {};
      var sameSort = JSON.stringify(d.sort) === JSON.stringify(state.cfg.cardSort);
      // A column without conditions and with the common order keeps following the common order.
      if (!d.conds.length && sameSort) delete views[editor.col.key];
      else views[editor.col.key] = { match: d.match === 'any' ? 'any' : 'all', conds: d.conds, sort: sameSort ? null : d.sort };
    } else {
      state.cfg.cats = d.cats.map(function (c) {
        var name = (c.name || '').trim();
        var isBuiltIn = t('cat_' + c.id) !== 'cat_' + c.id;
        return { id: c.id, name: name || (isBuiltIn ? '' : t('untitled')), limitH: posNum(c.limitH) };
      });
      state.cfg.weekLimitH = posNum(d.weekLimitH);
      state.cfg.cardSort = d.cardSort;
    }
    closeEditor();
    render(true);
    await saveCfg();
  }

  // ---------- navigation requests from plugin.js ----------
  // plugin.js writes {page, ts} to local secret storage before it opens the view.
  // The view polls it, so a header button also works while the view is already open.
  var lastNavTs = 0;
  async function checkNav() {
    if (typeof PluginAPI.getSecret !== 'function') return;
    var raw;
    try { raw = await PluginAPI.getSecret(NAV_SECRET); } catch (e) { return; }
    if (!raw) return;
    var nav;
    try { nav = JSON.parse(raw); } catch (e) { return; }
    if (!nav || !nav.ts || nav.ts <= lastNavTs) return;
    lastNavTs = nav.ts;
    if (nav.page === 'kanban') { state.kWeek = state.curWeek || state.kWeek; setPage('kanban'); }
    else if (nav.page === 'plan') setPage('plan');
    else if (nav.page === 'week') setPage('week');
  }

  // ---------- init ----------
  function applyStaticText() {
    $('poolTitle').textContent = t('pool');
    $('poolSearch').placeholder = t('poolSearchPh');
    $('poolCfgBtn').textContent = t('filterSort');
    $('poolHint').textContent = t('poolHint');
    $('poolEmpty').textContent = t('poolEmpty');
    $('overdueTitle').textContent = t('overdue');
    $('moveAllBtn').textContent = t('moveAll');
    $('planHint').textContent = t('planHint');
    $('weekToday').textContent = t('today');
    $('kToday').textContent = t('today');
    $('catsBtn').textContent = t('catsBtn');
    $('addBtn').textContent = t('add');
    $('stripTitle').textContent = t('stripTitle');
    $('toastUndo').textContent = t('undo');
    [['planPrev', 'prevW'], ['planNext', 'nextW'], ['weekPrev', 'prevW'], ['weekNext', 'nextW'], ['kPrev', 'prevW'], ['kNext', 'nextW']]
      .forEach(function (p) { $(p[0]).title = t(p[1]); $(p[0]).setAttribute('aria-label', t(p[1])); });
  }

  async function resolveLang() {
    var code = '';
    try { code = PluginAPI.cfg && PluginAPI.cfg.lang && PluginAPI.cfg.lang.code; } catch (e) { code = ''; }
    if (!code) {
      try { code = await Promise.resolve(PluginAPI.getCurrentLanguage()); } catch (e) { code = ''; }
    }
    langCode = String(code || navigator.language || 'en').toLowerCase();
    document.documentElement.lang = langCode;
  }

  function applyTheme() {
    var theme = null;
    try { theme = PluginAPI.cfg && PluginAPI.cfg.theme; } catch (e) { theme = null; }
    if (!theme && window.matchMedia) theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.body.classList.toggle('dark', theme === 'dark');
  }

  function bindEvents() {
    $('tabPlan').addEventListener('click', function () { setPage('plan'); });
    $('tabWeek').addEventListener('click', function () { setPage('week'); });
    $('tabKanban').addEventListener('click', function () { setPage('kanban'); });

    $('planPrev').addEventListener('click', function () { state.planStart = shiftWeek(state.planStart, -1); render(true); });
    $('planNext').addEventListener('click', function () { state.planStart = shiftWeek(state.planStart, 1); render(true); });
    $('weekPrev').addEventListener('click', function () { state.week = shiftWeek(state.week, -1); render(true); });
    $('weekNext').addEventListener('click', function () { state.week = shiftWeek(state.week, 1); render(true); });
    $('weekToday').addEventListener('click', function () { state.week = state.curWeek; render(true); });
    $('kPrev').addEventListener('click', function () { state.kWeek = shiftWeek(state.kWeek, -1); render(true); });
    $('kNext').addEventListener('click', function () { state.kWeek = shiftWeek(state.kWeek, 1); render(true); });
    $('kToday').addEventListener('click', function () { state.kWeek = state.curWeek; render(true); });
    $('catsBtn').addEventListener('click', function () { openEditor('cats'); });

    $('moveAllBtn').addEventListener('click', run(function () {
      return planTasks(overdueTasks().map(function (x) { return x.id; }), state.curWeek);
    }));
    $('addForm').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var title = $('addInput').value.trim();
      if (!title) return;
      $('addInput').value = '';
      run(addNew)(title);
    });

    $('poolSearch').addEventListener('input', function (ev) { state.poolQuery = ev.target.value; renderPool(); });
    $('poolCfgBtn').addEventListener('click', function () { openEditor('pool'); });
    $('poolSelAll').addEventListener('click', function (ev) {
      if (ev.currentTarget.dataset.mode === 'clear') state.poolSel = {};
      else poolTasks().forEach(function (x) { state.poolSel[x.id] = true; });
      renderPool();
    });
    $('poolAddSel').addEventListener('click', run(function () {
      return planTasks(poolTasks().filter(function (x) { return state.poolSel[x.id]; }).map(function (x) { return x.id; }), state.target);
    }));
    makeDropTarget($('poolCol'), function (id) { return state.assign[id] ? planTasks([id], null) : undefined; });

    $('toastUndo').addEventListener('click', function () { if (toastUndoFn) run(toastUndoFn)(); });
    $('toastClose').addEventListener('click', hideToast);

    document.addEventListener('keydown', function (ev) {
      if (ctxKeydown(ev)) return;
      if (ev.key === 'Escape' && editor) requestCloseEditor();
    });
    document.addEventListener('mousedown', function (ev) {
      if (ctx && !$('ctxMenu').contains(ev.target)) closeCtx();
    }, true);
    window.addEventListener('resize', function () { if (ctx) renderCtx(); }); // keep the menu inside the window
    window.addEventListener('scroll', function (ev) {
      if (ctx && !$('ctxMenu').contains(ev.target)) closeCtx();
    }, true);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) { scheduleLoad(); checkNav(); } });

    var H = PluginAPI.Hooks || {};
    try {
      PluginAPI.registerHook(H.DATA_CHANGED || 'dataChanged', scheduleLoad);
      PluginAPI.registerHook(H.PERSISTED_DATA_CHANGED || 'persistedDataChanged', scheduleLoad);
      PluginAPI.registerHook(H.DAY_CHANGE || 'dayChange', scheduleLoad);
    } catch (e) {
      showErr(e);
    }
  }

  async function init() {
    applyTheme();
    await resolveLang();
    applyStaticText();
    bindEvents();
    await load();
    await checkNav();
    setInterval(function () { if (!document.hidden) checkNav(); }, 800);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { init().catch(showErr); });
  } else {
    init().catch(showErr);
  }
})();
</script>
</body>
</html>
