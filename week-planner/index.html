<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Week planner</title>
<style>
  :root {
    --bg: #f5f5f7; --card: #ffffff; --card2: #ececf0; --text: #1d1d1f; --muted: #6e6e76; --soft: #4a4a52;
    --border: #e0e0e5; --border-hi: #c9c9d1; --accent: #4f46e5; --accent-soft: #eef0ff;
    --shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 1px 3px rgba(0, 0, 0, .04);
    --warn: #c2410c; --warn-soft: #fff4ea; --bad: #dc2626; --bad-soft: #fdecec; --ok: #15803d; --ok-soft: #e8f6ec;
  }
  body.dark {
    --bg: #121215; --card: #1e1e22; --card2: #16161a; --text: #ececef; --muted: #9a9aa3; --soft: #c4c4cb;
    --border: #2a2a30; --border-hi: #3a3a42; --accent: #9496ff; --accent-soft: #26264a;
    --shadow: 0 1px 3px rgba(0, 0, 0, .35);
    --warn: #fb923c; --warn-soft: #3a2616; --bad: #f87171; --bad-soft: #3b1a1a; --ok: #4ade80; --ok-soft: #173322;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 Roboto, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 1500px; margin: 0 auto; padding: 12px 16px 80px; }
  [hidden] { display: none !important; }
  button, input, select { font: inherit; color: inherit; }
  button {
    border: 1px solid var(--border); background: var(--card); border-radius: 8px;
    padding: 6px 10px; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.ghost { background: transparent; }
  button.danger { color: var(--bad); }
  button.danger.armed { background: var(--bad); border-color: var(--bad); color: #fff; }
  button.icon { width: 30px; height: 30px; padding: 0; line-height: 28px; text-align: center; }
  button.small { padding: 3px 8px; font-size: 12px; }
  input[type=text], input[type=search], input[type=number], input[type=date], select {
    padding: 7px 9px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); min-width: 0;
  }
  input[type=text], input[type=search] { width: 100%; }
  input:focus, select:focus, button:focus-visible, .item:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  h2 { margin: 0; font-size: 16px; }
  h3 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .muted { color: var(--muted); font-size: 12px; }
  .bad-text { color: var(--bad); }
  .due-over { color: var(--bad); }

  /* tabs */
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; border-bottom: 1px solid var(--border); }
  .tab {
    border: 0; border-bottom: 3px solid transparent; border-radius: 0; background: transparent;
    padding: 8px 12px; font-weight: 500; color: var(--muted);
  }
  .tab.on { color: var(--accent); border-bottom-color: var(--accent); }
  .tab:hover:not(:disabled) { color: var(--text); }

  /* layout */
  .grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); gap: 16px; align-items: start; }
  @media (max-width: 900px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
  .col { min-width: 0; border-radius: 12px; padding: 4px; transition: background .15s; }
  .drop { background: var(--accent-soft) !important; outline: 2px dashed var(--accent); }
  .col-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 6px 0 10px; }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; }
  .toolbar .grow { flex: 1; }
  .toolbar input[type=search] { flex: 1 1 180px; width: auto; }
  .hint { margin-bottom: 8px; }
  .nav { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
  .nav .title { flex: 1; text-align: center; min-width: 180px; }
  .page-title { font-size: 18px; font-weight: 600; }
  section { margin-bottom: 18px; }
  .sec-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .sec-head h3 { margin: 0; }
  .badge {
    display: inline-block; margin: 2px 4px 0 0; padding: 1px 8px; border-radius: 10px;
    font-size: 11px; font-weight: 500; background: var(--accent-soft); color: var(--accent);
  }
  .badge.past { background: var(--warn-soft); color: var(--warn); }
  .banner {
    padding: 10px 12px; margin-bottom: 12px; border-radius: 10px;
    background: var(--bad-soft); color: var(--bad); border: 1px solid var(--bad);
  }
  .panel {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; padding: 10px 12px; margin-bottom: 12px;
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  }
  .bar { flex-basis: 100%; height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; }
  .bar > div { height: 100%; background: var(--ok); transition: width .2s; }
  .bar.over > div { background: var(--bad); }
  .hours { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .hours.over { color: var(--bad); font-weight: 600; }
  .num-input { width: 60px; padding: 3px 6px !important; }
  .row { display: flex; gap: 8px; margin-bottom: 14px; }

  /* lists and rows */
  .list { list-style: none; margin: 0; padding: 0; }
  /* Task cards look like the task cards on the Super Productivity board. */
  .item {
    position: relative; display: flex; align-items: center; gap: 12px; padding: 10px 14px 10px 12px; margin-bottom: 6px;
    background: var(--card); border: 1px solid var(--border); border-radius: 6px; box-shadow: var(--shadow);
    cursor: grab; transition: border-color .15s, opacity .15s;
  }
  .item:hover { border-color: var(--border-hi); }
  .item.pool { cursor: pointer; }
  .item.pool.sel { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
  .item.overdue { border-left: 3px solid var(--warn); }
  .item.done { opacity: .5; }
  .item.done:hover { opacity: .8; }
  .item.done .name { text-decoration: line-through; }
  .item input[type=checkbox] {
    -webkit-appearance: none; appearance: none; position: relative; flex-shrink: 0; width: 22px; height: 22px; margin: 0;
    border: 2px solid var(--muted); border-radius: 6px; background: transparent; opacity: .75; cursor: pointer;
  }
  .item input[type=checkbox]:hover:not(:disabled) { opacity: 1; border-color: var(--ok); }
  .item input[type=checkbox]:checked { opacity: 1; border-color: var(--ok); background: var(--ok); }
  .item input[type=checkbox]:checked::after {
    content: ''; position: absolute; left: 5px; top: 1px; width: 6px; height: 11px;
    border: solid var(--card); border-width: 0 2px 2px 0; transform: rotate(45deg);
  }
  .body { flex: 1; min-width: 0; }
  .parent { margin-bottom: 2px; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .name { font-size: 15px; font-weight: 500; line-height: 1.35; cursor: pointer; overflow-wrap: anywhere; }
  .name:hover { color: var(--accent); }
  .mline { display: flex; flex-wrap: wrap; gap: 1px 12px; margin-top: 4px; font-size: 13px; color: var(--muted); }
  .mchip { display: inline-flex; align-items: center; gap: 5px; min-width: 0; }
  .mico { font-size: 12px; line-height: 1; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
  .side { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
  .est-col { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font-size: 15px; color: var(--soft); white-space: nowrap; }
  .est-col .est.empty { font-size: 12px; color: var(--muted); }
  .subs { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; color: var(--muted); }
  .due { display: flex; flex-direction: column; align-items: center; font-size: 12px; line-height: 1.1; color: var(--muted); white-space: nowrap; }
  .due.over { color: var(--bad); }
  .ic { display: inline-flex; }
  .ic svg { width: 20px; height: 20px; fill: currentColor; }
  .subs .ic svg { width: 14px; height: 14px; }
  .actions { display: flex; flex-wrap: wrap; gap: 4px; flex-shrink: 0; justify-content: flex-end; }
  /* Narrow board columns: keep room for the title. */
  .bcol { container-type: inline-size; }
  @container (max-width: 340px) {
    .item { gap: 10px; padding: 9px 10px; }
    .side { gap: 8px; }
    .est-col { font-size: 13px; }
    .est-col .est { max-width: 64px; white-space: normal; text-align: right; line-height: 1.2; }
    .due .ic svg { width: 18px; height: 18px; }
  }
  .empty { padding: 4px 2px; margin: 0; }

  /* planning: week cards */
  .weeks-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
  .wcard {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
    cursor: pointer; transition: background .15s;
  }
  .wcard.target { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .wcard.over { border-color: var(--bad); }
  .wcard-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; }
  .wcard .bar { margin: 6px 0; }
  .catline { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; }
  .catline.over { color: var(--bad); font-weight: 600; }

  /* boards */
  .board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, 1fr); gap: 12px; align-items: start; overflow-x: auto; padding-bottom: 6px; }
  @media (max-width: 640px) { .board { grid-auto-flow: row; grid-auto-columns: auto; overflow-x: visible; } }
  .bcol { background: var(--card2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 8px 8px; min-height: 160px; transition: background .15s; }
  .bcol.over { border-color: var(--bad); }
  .bcol-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 8px; padding: 0 6px; margin-bottom: 10px; color: var(--soft); }
  .bcol-title { font-weight: 600; font-size: 15px; color: var(--muted); }
  .bcol-name { display: inline-flex; align-items: center; gap: 4px; min-width: 0; }
  .edit-btn {
    display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; padding: 0;
    border: 0; border-radius: 50%; background: transparent; color: var(--muted); opacity: .7;
  }
  .edit-btn svg { width: 16px; height: 16px; fill: currentColor; }
  .edit-btn:hover:not(:disabled) { opacity: 1; color: var(--text); background: var(--accent-soft); }
  .edit-btn.on { opacity: 1; color: var(--accent); }
  .bcol .bar { margin: 0 6px 10px; flex-basis: auto; }
  .bcol .item { margin-bottom: 6px; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: flex; flex-direction: column; align-items: center; min-width: 84px; padding: 6px 8px; }
  .chip.sel { border-color: var(--accent); background: var(--accent-soft); }
  .chip.over { border-color: var(--bad); }
  .chip.over b { color: var(--bad); }
  .chip b { font-size: 15px; }
  .tog { border-radius: 14px; padding: 3px 10px; font-size: 13px; }
  .tog.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chipsel { display: flex; flex-wrap: wrap; gap: 6px; flex-basis: 100%; }

  /* modal */
  .overlay {
    position: fixed; inset: 0; background: rgba(0, 0, 0, .45);
    display: flex; align-items: flex-start; justify-content: center; padding: 24px 12px; z-index: 10;
  }
  .modal {
    width: 100%; max-width: 720px; max-height: calc(100vh - 48px); overflow: auto;
    background: var(--card); border-radius: 12px; padding: 16px; border: 1px solid var(--border);
  }
  .modal h2 { margin-bottom: 12px; }
  .field { margin-bottom: 14px; }
  .field > label { display: block; margin-bottom: 4px; font-size: 12px; color: var(--muted); }
  .cond, .sortrow, .catrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 8px; }
  .cond { padding: 8px; border: 1px solid var(--border); border-radius: 8px; }
  .catrow input[type=text] { flex: 1 1 160px; width: auto; }
  .notice { padding: 8px 10px; margin-top: 12px; border-radius: 8px; background: var(--warn-soft); color: var(--warn); }
  .modal-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 16px; }
  .modal-foot .grow { flex: 1; }

  /* task context menu */
  .ctx {
    position: fixed; z-index: 30; min-width: 270px; max-width: calc(100vw - 16px); max-height: calc(100vh - 16px);
    overflow: auto; padding: 4px 0; background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .3);
  }
  .ctx-item {
    display: flex; align-items: center; gap: 12px; width: 100%; padding: 9px 14px;
    border: 0; border-radius: 0; background: transparent; text-align: left;
  }
  .ctx-item:hover:not(:disabled), .ctx-item:focus-visible { background: var(--accent-soft); outline: none; }
  .ctx-item .ico { width: 18px; text-align: center; color: var(--muted); flex-shrink: 0; }
  .ctx-item .grow { flex: 1; }
  .ctx-item .val { color: var(--muted); font-size: 12px; }
  .ctx-item.danger, .ctx-item.danger .ico { color: var(--bad); }
  .ctx-item.armed { background: var(--bad); color: #fff; }
  .ctx-item.armed .ico { color: #fff; }
  .ctx-sep { height: 1px; margin: 4px 0; background: var(--border); }
  .ctx-dates { display: grid; grid-template-columns: repeat(4, 1fr); }
  .ctx-date {
    display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px;
    border: 0; border-radius: 0; background: transparent; font-size: 12px;
  }
  .ctx-date .ico { font-size: 16px; color: var(--muted); }
  .ctx-date:hover, .ctx-date:focus-visible { background: var(--accent-soft); outline: none; }
  .ctx-head { padding: 8px 14px 4px; font-weight: 600; }
  .ctx-form { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px 14px; }
  .more-btn { width: 26px; height: 24px; padding: 0; line-height: 20px; font-size: 16px; }
  .item > .more-btn {
    position: absolute; top: 3px; right: 3px; width: 24px; height: 20px; line-height: 16px;
    border: 0; background: var(--card); color: var(--muted); opacity: 0;
  }
  .item:hover > .more-btn, .item > .more-btn:focus-visible { opacity: 1; }
  .item > .more-btn:hover { color: var(--text); }
  @media (hover: none) { .item > .more-btn { opacity: .7; } }
  .est-link { cursor: pointer; border-radius: 4px; }
  .est-link:hover, .est-link:focus-visible { color: var(--accent); outline: none; }
  /* Priority looks like in Super Productivity: a digit in a ring; 1 blue, 2 amber, 3 red. */
  .prio {
    display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
    width: 17px; height: 17px; border: 1.5px solid currentColor; border-radius: 50%;
    font-size: 10px; font-weight: 700; line-height: 1; vertical-align: middle;
  }
  .prio-1 { color: #4a7fd8; }
  .prio-2 { color: #d08a12; }
  .prio-3 { color: #e0453a; }
  body.dark .prio-1 { color: #a8c7fa; }
  body.dark .prio-2 { color: #f6b13b; }
  body.dark .prio-3 { color: #f2665c; }

  /* toast */
  .toast {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 20;
    display: flex; align-items: center; gap: 10px; max-width: calc(100% - 24px);
    padding: 10px 12px; border-radius: 10px; background: #26262b; color: #f2f2f4;
    box-shadow: 0 6px 24px rgba(0, 0, 0, .25);
  }
  .toast.warn { border-left: 4px solid #f87171; }
  .toast button { background: transparent; color: inherit; border-color: rgba(255, 255, 255, .3); }
  #toastMsg { white-space: pre-line; }
  @media (max-width: 560px) {
    .wrap { padding: 10px 10px 80px; }
    .item.pool, .item.overdue { flex-wrap: wrap; }
    .item.pool .actions, .item.overdue .actions { flex-basis: 100%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <nav class="tabs" role="tablist">
    <button type="button" class="tab" id="tabPlan" role="tab"></button>
    <button type="button" class="tab" id="tabWeek" role="tab"></button>
    <button type="button" class="tab" id="tabKanban" role="tab"></button>
  </nav>

  <!-- ===== Planning ===== -->
  <div id="pagePlan" class="grid2">
    <div id="poolCol" class="col">
      <div class="col-head">
        <h2 id="poolTitle"></h2>
        <span id="poolInfo" class="muted"></span>
      </div>
      <div class="toolbar">
        <input id="poolSearch" type="search" autocomplete="off">
        <button type="button" id="poolCfgBtn"></button>
      </div>
      <div id="poolPresets" class="chips" style="margin-bottom:8px"></div>
      <div id="poolSummary" class="muted hint"></div>
      <div id="poolHint" class="muted hint"></div>
      <div class="toolbar">
        <button type="button" id="poolSelAll" class="small"></button>
        <span class="grow"></span>
        <button type="button" id="poolAddSel" class="primary small" hidden></button>
      </div>
      <ul id="poolList" class="list" role="listbox" aria-multiselectable="true"></ul>
      <p id="poolEmpty" class="muted empty" hidden></p>
    </div>
    <div class="col">
      <section id="overdueSec" hidden>
        <div class="sec-head">
          <h3 id="overdueTitle"></h3>
          <button type="button" id="moveAllBtn" class="small"></button>
        </div>
        <ul id="overdueList" class="list"></ul>
      </section>
      <div class="nav">
        <button type="button" id="planPrev" class="icon">‹</button>
        <div class="title"><span id="planTitle" class="page-title"></span></div>
        <button type="button" id="planNext" class="icon">›</button>
      </div>
      <div id="planHint" class="muted hint"></div>
      <div id="weeksGrid" class="weeks-grid"></div>
    </div>
  </div>

  <!-- ===== Week ===== -->
  <div id="pageWeek" hidden>
    <div class="nav">
      <button type="button" id="weekPrev" class="icon">‹</button>
      <div class="title">
        <div id="weekTitle" class="page-title"></div>
        <div id="weekRange" class="muted"></div>
      </div>
      <button type="button" id="weekNext" class="icon">›</button>
      <button type="button" id="weekToday" class="ghost"></button>
      <button type="button" id="catsBtn"></button>
    </div>
    <div id="weekBanner" class="banner" role="alert" hidden></div>
    <div id="weekPanel" class="panel"></div>
    <form id="addForm" class="row">
      <input id="addInput" type="text" autocomplete="off">
      <button type="submit" id="addBtn" class="primary"></button>
    </form>
    <div id="weekBoard" class="board"></div>
    <section style="margin-top:18px">
      <h3 id="stripTitle"></h3>
      <div id="weekStrip" class="chips"></div>
    </section>
  </div>

  <!-- ===== Kanban ===== -->
  <div id="pageKanban" hidden>
    <div class="nav">
      <button type="button" id="kPrev" class="icon">‹</button>
      <div class="title">
        <div id="kTitle" class="page-title"></div>
        <div id="kRange" class="muted"></div>
      </div>
      <button type="button" id="kNext" class="icon">›</button>
      <button type="button" id="kToday" class="ghost"></button>
    </div>
    <div id="kCats" class="chips" style="margin-bottom:10px"></div>
    <div id="kPanel" class="panel"></div>
    <div id="kBoard" class="board"></div>
  </div>
</div>

<div id="overlay" class="overlay" hidden><div id="modal" class="modal" role="dialog" aria-modal="true"></div></div>
<div id="ctxMenu" class="ctx" role="menu" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden>
  <span id="toastMsg"></span>
  <button type="button" id="toastUndo" class="small"></button>
  <button type="button" id="toastClose" class="small" aria-label="✕">✕</button>
</div>

<script>
(function () {
  'use strict';

  var KEY_PREFIX = 't_';
  var CFG_KEY = 'cfg';
  var WL_PREFIX = 'wl_';
  var NAV_SECRET = 'nav';
  var WEEK_RE = /^\d{4}-W\d{2}$/;
  var HOUR = 3600000;
  var TODAY_TAG = 'TODAY';
  var UNSORTED = 'unsorted';
  var STATUSES = ['todo', 'doing', 'done'];
  var PLAN_WEEKS = 6;

  var TEXT = {
    en: {
      tabPlan: 'Planning', tabWeek: 'Week {n}', tabKanban: 'Kanban',
      week: 'Week {n}', current: 'current', past: 'past', future: 'upcoming', today: 'This week',
      prevW: 'Previous week', nextW: 'Next week', h: 'h', m: 'm', due: 'due',
      subtask: 'subtask', archived: 'archived', estimate: 'estimate {t}', spentT: 'spent {t}',
      openTitle: 'Open the task in Super Productivity',
      doneTitle: 'Mark as done',
      pool: 'Unplanned', poolSearchPh: 'Quick search…', poolEmpty: 'No unplanned tasks match the filter.',
      poolHint: 'Click a row to select several tasks. Drag a task onto a week on the right.',
      filterSort: 'Filter & sort', selectAll: 'Select all', clearSel: 'Clear selection',
      addSelected: 'Add {n} to week {w}', addTo: '→ W{n}', addToTitle: 'Plan for week {n}',
      overdue: 'Overdue from past weeks', moveAll: 'Move all to this week', toCurrentBtn: '→ this week',
      planTitle: 'Weeks {a}–{b}', planHint: 'Click a week to make it the target of the "→" buttons. Drop tasks onto a week.',

      var w = k.slice(WL_PREFIX.length);
      var o = parseWeekLimits(vals[i]);
      if (o && WEEK_RE.test(w)) map[w] = o;
    });
    return map;
  }
  function ownLimitsFrom(w) {
    var cats = {};
    state.cfg.cats.forEach(function (c) { cats[c.id] = catLimitH(w, c); });
    return { week: weekLimitH(w), cats: cats };
  }
  async function saveWeekLimits(w, o) {
    if (o) state.weekLimits[w] = o;
    else delete state.weekLimits[w];
    render(true);
    await PluginAPI.persistDataSynced(o ? JSON.stringify(o) : '', WL_PREFIX + w);
  }

  function overLimits(w) {
    var ld = weekLoad(w);
    var out = [];
    var wl = limMs(weekLimitH(w));
    if (wl && ld.total > wl) out.push({ id: '_week', name: t('week', { n: weekNum(w) }), h: ld.total, lim: wl });
    state.cfg.cats.forEach(function (c) {
      var l = limMs(catLimitH(w, c));
      if (l && ld.cats[c.id].h > l) out.push({ id: c.id, name: catName(c), h: ld.cats[c.id].h, lim: l });
    });
    return out;
  }

  function overdueTasks() {
    return Object.keys(state.assign)
      .filter(function (id) {
        var task = state.tasks[id];
        return task && !task.isDone && state.assign[id].w < state.curWeek;
      })
      .map(function (id) { return state.tasks[id]; })
      .sort(function (a, b) { return state.assign[a.id].w < state.assign[b.id].w ? -1 : 1; });
  }

  // ---------- ready-made pool filters ----------
  // Every preset hides subtasks, like the default custom filter: their hours are part of the parent.
  var NO_SUB = { field: 'isSubtask', op: 'isFalse' };
  var PRESETS = [
    { id: 'urgent', conds: [{ field: 'due', op: 'byDays', value: 7 }], sort: [{ field: 'due', dir: 'asc' }, { field: 'x:priority', dir: 'desc' }] },
    { id: 'week', conds: [{ field: 'due', op: 'inSelWeek' }], sort: [{ field: 'due', dir: 'asc' }] },
    { id: 'prio', needs: 'x:priority', conds: [{ field: 'x:priority', op: 'notEmpty' }], sort: [{ field: 'x:priority', dir: 'desc' }, { field: 'due', dir: 'asc' }] },
    { id: 'noest', conds: [{ field: 'timeEstimate', op: 'empty' }], sort: [{ field: 'due', dir: 'asc' }, { field: 'created', dir: 'asc' }] },
    { id: 'quick', conds: [{ field: 'timeEstimate', op: 'notEmpty' }, { field: 'timeEstimate', op: 'lte', value: 0.5 }], sort: [{ field: 'timeEstimate', dir: 'asc' }, { field: 'due', dir: 'asc' }] },
    { id: 'started', conds: [{ field: 'timeSpent', op: 'notEmpty' }], sort: [{ field: 'timeSpent', dir: 'desc' }] },
    { id: 'stale', conds: [{ field: 'created', op: 'olderThanDays', value: 30 }], sort: [{ field: 'created', dir: 'asc' }] },
    { id: 'issues', conds: [{ field: 'hasIssue', op: 'isTrue' }], sort: [{ field: 'due', dir: 'asc' }, { field: 'issueType', dir: 'asc' }] }
  ];

  function presetView(p) {
    return { id: 'pool', match: 'all', conds: [NO_SUB].concat(p.conds), sort: p.sort };
  }
  function availablePresets() {
    return PRESETS.filter(function (p) { return !p.needs || fieldMap[p.needs]; });
  }
  function presetLabel(id) {
    return id === 'week' ? t('pr_week', { n: weekNum(state.target) }) : t('pr_' + id);
  }
  function activePreset() {
    var id = state.cfg.poolPreset;
    return availablePresets().filter(function (p) { return p.id === id; })[0] || null;
  }
  function activePoolView() {
    var p = activePreset();
    return p ? presetView(p) : state.cfg.pool;
  }

  function poolTasks(view) {
    var v = view || activePoolView();
    var q = state.poolQuery.trim().toLowerCase();
    return sortTasks(Object.keys(state.tasks).map(function (id) { return state.tasks[id]; }).filter(function (task) {
      return !task.isDone && !state.archived[task.id] && !state.assign[task.id] &&
        (!q || String(task.title || '').toLowerCase().indexOf(q) !== -1) && matchView(task, v);
    }), v.sort);
  }

  // ---------- changes ----------
  function applyEntries(changes) {
    Object.keys(changes).forEach(function (id) {
      if (changes[id]) state.assign[id] = changes[id];
      else delete state.assign[id];
      delete state.poolSel[id];
    });
    render(true);
    return Promise.all(Object.keys(changes).map(function (id) {
      return PluginAPI.persistDataSynced(serializeEntry(changes[id]), KEY_PREFIX + id);
    })).then(function () { return syncProgressTags(Object.keys(changes)); });
  }

  // Tasks in the "In progress" kanban column carry the #in-progress tag; other tasks lose it.
  // The tag is created on first use.
  var PROGRESS_TAG = 'in-progress';
  var progressTagReq = null;
  var createdProgressTag = null; // guards against a second tag while getAllTags does not list the new one yet
  function progressTagId() {
    return Object.keys(state.tags).filter(function (id) {
      return String(state.tags[id]).toLowerCase() === PROGRESS_TAG;
    })[0] || createdProgressTag;
  }
  function ensureProgressTag() {
    var id = progressTagId();
    if (id) return Promise.resolve(id);
    if (typeof PluginAPI.addTag !== 'function') return Promise.resolve(null);
    if (!progressTagReq) {
      progressTagReq = PluginAPI.addTag({ title: PROGRESS_TAG }).then(function (newId) {
        progressTagReq = null;
        if (newId) { createdProgressTag = newId; state.tags[newId] = PROGRESS_TAG; state.looks['t:' + newId] = { icon: null, color: null }; }
        return newId || null;
      }, function (e) { progressTagReq = null; throw e; });
    }
    return progressTagReq;
  }
  var progressSyncs = 0;
  async function syncProgressTags(ids) {
    progressSyncs++;
    try { await syncProgressTagsNow(ids); } finally { progressSyncs--; }
  }
  async function syncProgressTagsNow(ids) {
    for (var i = 0; i < ids.length; i++) {
      var task = state.tasks[ids[i]];
      if (!task || state.archived[task.id]) continue;
      var want = statusOf(task) === 'doing';
      var tagId = progressTagId();
      var tags = task.tagIds || [];
      var has = !!tagId && tags.indexOf(tagId) !== -1;
      if (want === has) continue;
      if (want) {
        tagId = await ensureProgressTag();
        if (!tagId) continue;
        await updateTaskFields(task, { tagIds: tags.concat(tagId) });
      } else {
        await updateTaskFields(task, { tagIds: tags.filter(function (x) { return x !== tagId; }) });
      }
    }
  }

  // Applies entry changes, warns about newly exceeded limits and offers undo.
  async function changeEntries(changes, msg, withUndo) {
    var ids = Object.keys(changes);
    if (!ids.length) return;
    var prev = {}, weeks = {};
    ids.forEach(function (id) {
      var old = state.assign[id];
      prev[id] = old ? { w: old.w, c: old.c, s: old.s } : null;
      if (old) weeks[old.w] = true;
      if (changes[id]) weeks[changes[id].w] = true;
    });
    var before = {};
    Object.keys(weeks).forEach(function (w) { overLimits(w).forEach(function (o) { before[w + '|' + o.id] = true; }); });
    await applyEntries(changes);
    var warn = [];
    Object.keys(weeks).forEach(function (w) {
      overLimits(w).forEach(function (o) {
        if (!before[w + '|' + o.id]) warn.push(t('overLine', { w: weekNum(w), name: o.name, a: fmtDur(o.h), b: fmtDur(o.lim) }));
      });
    });
    var text = [msg].concat(warn).filter(Boolean).join('\n');
    if (!text) return;
    showToast(text, warn.length > 0, withUndo ? function () {
      hideToast();
      return applyEntries(prev).then(function () { showToast(t('undone'), false, null); });
    } : null);
  }

  function planTasks(ids, w) {
    var changes = {};
    ids.forEach(function (id) {
      var old = state.assign[id];
      if ((old ? old.w : null) === (w || null)) return;
      changes[id] = w ? { w: w, c: old ? old.c : UNSORTED, s: old ? old.s : 'todo' } : null;
    });
    var n = Object.keys(changes).length;
    if (!n) return Promise.resolve();
    var allNew = ids.every(function (id) { return !state.assign[id]; });
    var msg = !w ? t('toastRemoved', { n: n }) : (allNew ? t('toastAdded', { w: weekNum(w), n: n }) : t('toastMoved', { w: weekNum(w), n: n }));
    return changeEntries(changes, msg, true);
  }

  function moveToCat(id, catId) {
    var old = state.assign[id];
    if (!old || catById(old.c).id === catId) return Promise.resolve();
    return changeEntries(_obj(id, { w: old.w, c: catId, s: old.s }), null, false);
  }

  async function setStatus(task, s) {
    var old = state.assign[task.id];
    if (!old || statusOf(task) === s) return;
    if (s === 'done') {
      task.isDone = true;
      render(true);
      await PluginAPI.updateTask(task.id, { isDone: true });
      await syncProgressTags([task.id]);
      return;
    }
    var wasDone = task.isDone;
    task.isDone = false;
    await applyEntries(_obj(task.id, { w: old.w, c: old.c, s: s }));
    if (wasDone) await PluginAPI.updateTask(task.id, { isDone: false });
  }

  async function toggleDone(task, isDone) {
    task.isDone = isDone;
    render(true);
    await PluginAPI.updateTask(task.id, { isDone: isDone });
    await syncProgressTags([task.id]);
  }

  async function setEstimate(task, hours) {
    var ms = Math.max(0, Math.round((hours || 0) * 4) / 4) * HOUR;
    if (ms === (task.timeEstimate || 0)) return;
    var e = state.assign[task.id];
    var before = {};
    if (e) overLimits(e.w).forEach(function (o) { before[o.id] = true; });
    task.timeEstimate = ms;
    render(true);
    await PluginAPI.updateTask(task.id, { timeEstimate: ms });
    if (e) {
      var warn = overLimits(e.w).filter(function (o) { return !before[o.id]; }).map(function (o) {
        return t('overLine', { w: weekNum(e.w), name: o.name, a: fmtDur(o.h), b: fmtDur(o.lim) });
      });
      if (warn.length) showToast(warn.join('\n'), true, null);
    }
  }

  async function addNew(title) {
    var id = await PluginAPI.addTask({ title: title });
    await changeEntries(_obj(id, { w: state.week, c: UNSORTED, s: 'todo' }), t('toastAdded', { w: weekNum(state.week), n: 1 }), false);
    scheduleLoad();
  }

  function _obj(k, v) { var o = {}; o[k] = v; return o; }

  // ---------- drag and drop ----------
  function makeDraggable(node, id) {
    node.draggable = true;
    node.addEventListener('dragstart', function (ev) {
      ev.dataTransfer.setData('text/plain', 'wp:' + id);
      ev.dataTransfer.effectAllowed = 'move';
    });
  }
  function makeDropTarget(node, onDrop) {
    node.addEventListener('dragover', function (ev) { ev.preventDefault(); node.classList.add('drop'); });
    node.addEventListener('dragleave', function (ev) { if (!node.contains(ev.relatedTarget)) node.classList.remove('drop'); });
    node.addEventListener('drop', function (ev) {
      ev.preventDefault();
      ev.stopPropagation();
      node.classList.remove('drop');
      var s = ev.dataTransfer.getData('text/plain');
      if (s && s.indexOf('wp:') === 0) run(onDrop)(s.slice(3));
    });
  }

  // ---------- shared pieces ----------
  // Icon and color of a project or tag, as Super Productivity shows them on task cards.
  function lookOf(x) {
    var color = (x.theme && x.theme.primary) || x.color || null;
    var icon = typeof x.icon === 'string' && /[^\x00-\x7F]/.test(x.icon) ? x.icon : null; // emoji only, no icon font
    return { icon: icon, color: color };
  }

  var ICONS = {
    due: 'M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 16H5V10h14v10zM5 8V6h14v2H5zm2 4h5v5H7z',
    subs: 'M22 11V3h-7v3H9V3H2v8h7V8h2v10h4v3h7v-8h-7v3h-2V8h2v3z'
  };
  function icon(name) {

  function metaChip(label, look, kind) {
    look = look || {};

    if (look.icon) mark = el('span', { className: 'mico', text: look.icon });
    else if (kind === 'project') mark = el('span', { className: 'mico', text: '▤', style: look.color ? 'color:' + look.color : null });
    else if (kind === 'plain') mark = null;

  // extra: more chips for the meta line, e.g. the category or the week.
  function metaLine(task, extra) {
    var parts = [];
    if (task.projectId && state.projects[task.projectId]) {
      parts.push(metaChip(state.projects[task.projectId], state.looks['p:' + task.projectId], 'project'));
    }
    (task.tagIds || []).forEach(function (id) {
      if (id !== TODAY_TAG) parts.push(metaChip(tagTitle(id), state.looks['t:' + id], 'tag'));
    });

    if (state.archived[task.id]) parts.push(metaChip(t('archived'), null, 'plain'));

  function fmtShortDay(ts) {

    return pad(d.getDate()) + '.' + pad(d.getMonth() + 1);
  }

  // onEst: when given, the estimate opens the estimate menu.
  function estBlock(task, onEst) {
    var est = task.timeEstimate || 0, spent = task.timeSpent || 0;
    var txt = est ? (spent ? fmtDur(spent) + ' / ' + fmtDur(est) : fmtDur(est)) : (spent ? fmtDur(spent) : '');
    var subs = (task.subTaskIds || []).length;
    var estNode = null;
    if (onEst) {
      estNode = el('span', {
        className: 'est est-link' + (txt ? '' : ' empty'), role: 'button', tabindex: '0', title: t('ctxEstimate'),
        text: txt || t('estAdd'), onclick: stop(onEst),
        onkeydown: function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); ev.stopPropagation(); onEst(ev); } }
      });
    } else if (txt) {
      estNode = el('span', { className: 'est', title: t('ctxEstimate'), text: txt });
    }
    if (!estNode && !subs) return null;
    return el('div', { className: 'est-col' }, [
      estNode,
      subs ? el('span', { className: 'subs', title: t('subtasksN', { n: subs }) }, [icon('subs'), String(subs)]) : null
    ]);

  function dueBlock(task) {
    var dueTs = task.dueWithTime || dateVal(task.dueDay);
    if (!dueTs) return null;
    var over = !task.isDone && dayOf(dueTs) < state.today;
    var full = task.dueWithTime ? fmtDayTime(task.dueWithTime) : fmtDay(parseYmd(task.dueDay));
    var short = fmtShortDay(dueTs);
    if (task.dueWithTime) {
      var d = new Date(task.dueWithTime);
      short += ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    }

  }

  function taskCard(task, o) {

    var li = el('li', { className: 'item' + (task.isDone ? ' done' : '') + (o.cls ? ' ' + o.cls : '') }, [
      o.check ? doneBox(task) : null,

  function numInput(value, step, title, onChange) {
    var input = el('input', {

      title: title, 'aria-label': title, value: value ? String(value) : ''

    }));
    input.addEventListener('blur', function () { setTimeout(function () { if (pendingRender) render(); }, 0); });
    return input;

  // The category limits together must not exceed the week limit.
  function catLimitSum(cats, exceptId) {
    return cats.reduce(function (s, c) { return s + (c.id !== exceptId && c.limitH ? c.limitH : 0); }, 0);
  }
  function hrs(h) { return fmtDur(h * HOUR); }

  // Inputs in the week page edit the own limits of the shown week, not the defaults.
  function limitInput(catId) {
    var w = state.week;
    var c = catId === '_week' ? null : catById(catId);
    var val = c ? catLimitH(w, c) : weekLimitH(w);
    var input = numInput(val, '0.5', c ? t('limitTitleWeek') : t('weekLimitTitle'), async function (v) {
      if ((c ? catLimitH(w, c) : weekLimitH(w)) === v) return;
      var own = ownLimitsFrom(w);
      var cats = weekCats(w);
      if (!c) {
        var sum = catLimitSum(cats);
        if (v !== null && v < sum) {
          v = sum;
          showToast(t('weekClamped', { t: hrs(sum) }), true, null);
        }
        own.week = v;
      } else {
        if (own.week && v !== null) {
          var room = Math.max(0, own.week - catLimitSum(cats, catId));
          if (room <= 0) {
            showToast(t('catNoRoom', { name: catName(c), w: hrs(own.week) }), true, null);
            render(true);
            return;
          }
          if (v > room) {
            v = room;
            showToast(t('catClamped', { name: catName(c), t: hrs(room), w: hrs(own.week) }), true, null);
          }
        }
        own.cats[catId] = v;
      }
      await saveWeekLimits(w, own);
    });
    var wl = weekLimitH(w);
    if (c && wl) input.max = String(Math.max(0, wl - catLimitSum(weekCats(w), catId)));
    return input;
  }

  function viewSummary(view) {
    var conds = view.conds || [];
    var parts = [conds.length ? conds.map(condText).join(view.match === 'any' ? ' | ' : ' · ') : t('noFilter')];
    if ((view.sort || []).length) parts.push(t('sortBy') + ': ' + sortText(view.sort));
    return parts.join(' — ');
